# Local development services for Ponder POC.
# Brings up Redis (blackboard + streams) and Qdrant (Hippocampus memory).
# Ollama runs natively on the host (not in this compose file) for model serving —
# benefits from native GPU access on Mac/Windows where Docker GPU support is limited.
#
# Usage:
#   docker compose up -d        # start
#   docker compose down         # stop, keep data
#   docker compose down -v      # stop, drop volumes

services:
  redis:
    image: redis:7.2-alpine
    container_name: ponder-redis
    command: redis-server --appendonly yes --maxmemory 2gb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.17.1
    container_name: ponder-qdrant
    ports:
      - "6333:6333"   # HTTP
      - "6334:6334"   # gRPC
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  redis-data:
  qdrant-data:
